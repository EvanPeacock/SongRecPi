<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SongRec Pi</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
:root {
    --panel-bg: rgba(20,20,20,0.55);
    --fallback-bg-1: #202020;
    --fallback-bg-2: #111111;
    --art-size: 180px;
}

html,body {
    margin:0;
    padding:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,var(--fallback-bg-1),var(--fallback-bg-2));
    transition:background 0.9s ease;
}

body {
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    padding:5px;
}

#panel {
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:18px;
    padding:16px 18px;
    background:var(--panel-bg);
    border-radius:14px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-sizing:border-box;
    max-width:calc(100vw - 10px);
    max-height:calc(100vh - 10px);
    overflow:visible;
    position:relative;
    transition:opacity 1.5s ease;
}

#albumArt {
    width: calc(min(var(--art-size), 40vmin, 260px));
    aspect-ratio: 1 / 1;
    background:#333 center/cover no-repeat;
    border-radius:12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.5);
    flex-shrink:0;
    transition:box-shadow .4s ease, transform .4s ease, width .25s ease;
}

.track-info {
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
}

.track-title, .track-artist {
    margin:0;
    color:#fff;
    word-break:break-word;
    white-space:normal;
    overflow:hidden;
    display:-webkit-box;
    -webkit-box-orient:vertical;
}

.track-title {
    font-size:2rem;
    font-weight:600;
    line-height:1.18;
}
.track-title.clamp1 { -webkit-line-clamp:1; }
.track-title.clamp2 { -webkit-line-clamp:2; }
.track-title.clamp3 { -webkit-line-clamp:3; }
.track-title.clamp4 { -webkit-line-clamp:4; }

.track-artist {
    font-size:1.05rem;
    line-height:1.2;
    margin-top:8px;
}
.track-artist.clamp1 { -webkit-line-clamp:1; }
.track-artist.clamp2 { -webkit-line-clamp:2; }

.flash {
    animation:flash-bg 0.6s ease;
}
@keyframes flash-bg {
    0%   { background-color:rgba(255,255,255,0.12); }
    100% { background-color:var(--panel-bg); }
}

/* Only the song view shows the panel; it stays laid out so fitPanel() can measure it. */
body:not(.view-song) #panel { opacity:0; visibility:hidden; }

/* "Listening..." / "Connecting to Wi-Fi...": centered and breathing, then small and still */
#idle {
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    color:rgba(255,255,255,0.55);
    font-size:1.6rem;
    letter-spacing:0.04em;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.5s ease;
}
body.view-listening #idle, body.view-checking #idle, body.view-quiet #idle { opacity:1; }
body.view-listening #idle, body.view-checking #idle { animation:breathe 4s ease-in-out infinite; }
body.view-quiet #idle {
    align-items:flex-end;
    padding-bottom:8px;
    font-size:0.8rem;
    color:rgba(255,255,255,0.3);
}
@keyframes breathe {
    0%,100% { color:rgba(255,255,255,0.35); }
    50%     { color:rgba(255,255,255,0.7); }
}

/* Only the song view is colored; listening, connecting and muted are plain black */
body.view-listening, body.view-quiet, body.view-checking, body.view-muted { background:#000 !important; }

/* Muted: black screen, small hint, gear for the settings QR */
#muted, #settingsQr { display:none; }
body.view-muted:not(.qr-open) #muted { display:block; }
#muted .hint {
    position:fixed;
    left:0; right:0; bottom:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:#5a5a5a;
    font-size:0.8rem;
}
#muted .hint svg { width:14px; height:14px; }
#gear {
    position:fixed;
    top:0; right:0;
    width:56px; height:56px;           /* generous target for a resistive touch panel */
    display:flex;
    align-items:center;
    justify-content:center;
    color:#5a5a5a;
}
#gear svg { width:22px; height:22px; }
body.view-muted.qr-open #settingsQr {
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2vh;
    color:#ddd;
    text-align:center;
}
#settingsQr img {
    width:min(45vw, 58vh);
    height:min(45vw, 58vh);
    background:#fff;
    border-radius:8px;
    image-rendering:pixelated;
}
#settingsQr .cap { font-size:0.95rem; font-weight:600; }
#settingsQr .sub { font-size:0.75rem; color:#888; }

/* WiFi setup view, sized for a 480x320 panel */
#setup {
    display:none;
    position:fixed;
    inset:0;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2vh;
    color:#fff;
    text-align:center;
}
body.view-setup #setup { display:flex; }
#setup h1 { margin:0; font-size:1.25rem; font-weight:600; }
.qr-row { display:flex; gap:16vw; justify-content:center; }
.qr-cell { display:flex; flex-direction:column; align-items:center; gap:1vh; }
.qr-cell img {
    width:min(30vw, 52vh);
    height:min(30vw, 52vh);
    background:#fff;
    border-radius:8px;
    image-rendering:pixelated;
}
.qr-cell .cap { font-size:0.95rem; font-weight:600; }
.qr-cell .sub { font-size:0.75rem; color:rgba(255,255,255,0.7); }
#setupStatus { font-size:0.95rem; min-height:1.2em; color:#ffd479; }
#setupStatus.ok { color:#9be89b; }

html, body, body * {
    cursor: none !important;
}

* {
    -webkit-user-select:none;
    user-select:none;
}
</style>
</head>
<body class="view-listening">
  <div id="panel">
      <div id="albumArt"></div>
      <div class="track-info">
          <div id="trackTitle" class="track-title clamp4"></div>
          <div id="trackArtist" class="track-artist clamp2"></div>
      </div>
  </div>
  <div id="idle">Listening&hellip;</div>
  <div id="muted">
      <div id="gear" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
      <div class="hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          <span>Tap the screen to wake and unmute</span>
      </div>
  </div>
  <div id="settingsQr">
      <img id="settingsQrImg" alt="">
      <div class="cap">Scan for settings</div>
      <div class="sub" id="settingsUrl"></div>
      <div class="sub">Tap to close</div>
  </div>
  <div id="setup">
      <h1>Wi-Fi setup</h1>
      <div class="qr-row">
          <div class="qr-cell">
              <img src="/qr/wifi.svg" alt="">
              <div class="cap">1. Scan to join</div>
              <div class="sub">{{ hotspot_info }}</div>
          </div>
          <div class="qr-cell">
              <img src="/qr/portal.svg" alt="">
              <div class="cap">2. Scan to set up</div>
              <div class="sub">{{ portal_url }}</div>
          </div>
      </div>
      <div id="setupStatus"></div>
  </div>

<script>
const POLL_INTERVAL = {{ poll_ms }};
const FETCH_TIMEOUT = 4000;
const TAP_SETTLE = 1500;     // ignore stale polls right after a tap
let lastId = "";
let lastArtURL = "";
let colorToken = 0;
let view = 'listening';
let qrOpen = false;
let lastTap = 0;
let expectMuted = null;

async function fetchTrack() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
    try {
        const res = await fetch('/current?ts=' + Date.now(), {signal: ctrl.signal, cache: 'no-store'});
        if (res.ok) render(await res.json());
    } catch(e) {
        console.warn('fetch /current failed:', e);
    } finally {
        clearTimeout(timer);
        setTimeout(fetchTrack, POLL_INTERVAL);
    }
}

function applyView() {
    if (view !== 'muted') qrOpen = false;
    document.body.className = 'view-' + view + (qrOpen ? ' qr-open' : '');
    document.getElementById('idle').textContent =
        view === 'checking' ? 'Connecting to Wi-Fi…' : 'Listening…';
}

function render(data) {
    const settling = Date.now() - lastTap < TAP_SETTLE && data.muted !== expectMuted;
    if (!settling) {
        view = data.view || 'listening';
        applyView();
    }
    if (view === 'setup') renderSetup(data.setup);
    renderTrack(data);
}

function renderTrack(data) {
    const title = data.title || '-';
    const artist = data.artist || '-';
    const art = data.album_art || '';
    const newId = title + '|' + artist + '|' + art;
    if (newId === lastId) return;

    const panel = document.getElementById('panel');
    panel.classList.remove('flash');
    void panel.offsetWidth;
    panel.classList.add('flash');

    document.getElementById('trackTitle').textContent = title;
    document.getElementById('trackArtist').textContent = artist;

    const artDiv = document.getElementById('albumArt');
    if (art) {
        artDiv.style.backgroundImage = 'url("' + art.replace(/["\\\n]/g, '\\$&') + '")';
        if (art !== lastArtURL) extractAndApplyDominantColor(art);
    } else {
        artDiv.style.backgroundImage = 'none';
        colorToken++;                       // drop any in-flight color extraction
        document.body.style.background = '';  // back to the CSS fallback gradient
    }
    lastArtURL = art;

    resetLayoutAllowances();
    fitPanel();
    lastId = newId;
}

const SETUP_MESSAGES = {
    waiting:    '',
    connecting: 'Connecting to ',
    failed:     'Couldn’t connect — check the password and try again',
    connected:  'Connected!'
};

function renderSetup(setup) {
    if (!setup) return;
    const status = document.getElementById('setupStatus');
    let msg = SETUP_MESSAGES[setup.status] || '';
    if (setup.status === 'connecting') msg += (setup.ssid || 'network') + '…';
    status.textContent = msg;
    status.classList.toggle('ok', setup.status === 'connected');
}

// Tap anywhere: mute (black screen, mic off) / unmute. In muted mode the gear shows
// a QR code for the settings page instead; tapping again closes it.
document.addEventListener('click', (e) => {
    if (view === 'setup' || view === 'checking') return;
    if (qrOpen) { qrOpen = false; applyView(); return; }
    if (view === 'muted' && e.target.closest('#gear')) { openSettingsQr(); return; }
    if (Date.now() - lastTap < 800) return;   // swallow double taps
    lastTap = Date.now();
    expectMuted = view !== 'muted';
    view = expectMuted ? 'muted' : 'listening';
    applyView();
    fetch('/api/mute', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({muted: expectMuted})
    }).catch((err) => console.warn('mute request failed:', err));
});

async function openSettingsQr() {
    qrOpen = true;
    document.getElementById('settingsQrImg').src = '/qr/settings.svg?ts=' + Date.now();
    applyView();
    try {
        const urls = await (await fetch('/api/settings-url')).json();
        document.getElementById('settingsUrl').textContent =
            urls.name + (urls.ip ? '  ·  ' + urls.ip.replace('http://', '') : '');
    } catch(e) {
        console.warn('settings url failed:', e);
    }
}

function resetLayoutAllowances() {
    const titleEl = document.getElementById('trackTitle');
    const artistEl = document.getElementById('trackArtist');
    titleEl.className = 'track-title clamp4';
    artistEl.className = 'track-artist clamp2';
    setArtSize(180);
}

function fitPanel() {
    const panel = document.getElementById('panel');
    const titleEl = document.getElementById('trackTitle');
    const artistEl = document.getElementById('trackArtist');
    const maxH = window.innerHeight - 10;
    let safety = 30;

    while (panel.scrollHeight > maxH && safety-- > 0) {
        if (titleEl.classList.contains('clamp4')) { titleEl.classList.replace('clamp4','clamp3'); continue; }
        if (titleEl.classList.contains('clamp3')) { titleEl.classList.replace('clamp3','clamp2'); continue; }
        if (titleEl.classList.contains('clamp2')) { titleEl.classList.replace('clamp2','clamp1'); continue; }
        if (artistEl.classList.contains('clamp2')) { artistEl.classList.replace('clamp2','clamp1'); continue; }
        const currentArt = getArtSize();
        if (currentArt > 125) { setArtSize(Math.max(125, currentArt - 15)); continue; }
        if (currentArt > 110) { setArtSize(Math.max(110, currentArt - 5)); continue; }
        break;
    }
}

function setArtSize(px) {
    document.documentElement.style.setProperty('--art-size', px + 'px');
}
function getArtSize() {
    const val = getComputedStyle(document.documentElement).getPropertyValue('--art-size').trim();
    return parseInt(val,10) || 180;
}

function extractAndApplyDominantColor(url) {
    const token = ++colorToken;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.referrerPolicy = "no-referrer";
    img.onload = () => {
        if (token !== colorToken) return;   // a newer track (or no art) superseded this load
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const size = 64;
            canvas.width = size;
            canvas.height = size;
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0,0,size,size).data;
            let r=0,g=0,b=0,count=0;
            for (let i=0;i<data.length;i+=4) {
                const R=data[i], G=data[i+1], B=data[i+2], A=data[i+3];
                if (A < 64) continue;
                const brightness = 0.299*R + 0.587*G + 0.114*B;
                if (brightness < 15 || brightness > 245) continue;
                r+=R; g+=G; b+=B; count++;
            }
            if (!count) return;
            r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
            const factor = 0.85;
            const avg = (r+g+b)/3;
            r = Math.round(r*factor + avg*(1-factor));
            g = Math.round(g*factor + avg*(1-factor));
            b = Math.round(b*factor + avg*(1-factor));
            const darker = 'rgb(' + Math.max(0,r-40) + ',' + Math.max(0,g-40) + ',' + Math.max(0,b-40) + ')';
            const main   = 'rgb(' + r + ',' + g + ',' + b + ')';
            document.body.style.background = 'linear-gradient(135deg,' + darker + ',' + main + ')';
        } catch(err) {
            console.warn("Color extraction failed:", err);
        }
    };
    img.onerror = () => console.warn("Album art load error; skipping dominant color.");
    img.src = url;
}

fetchTrack();
window.addEventListener('resize', () => { resetLayoutAllowances(); fitPanel(); });
</script>
</body>
</html>
