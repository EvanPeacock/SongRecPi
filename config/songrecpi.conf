# SongRecPi shared settings, installed to /etc/songrecpi.conf.
# Sourced by wifi-portal-start.sh and read by app.py / wifi-portal.py, so the
# hotspot and the on-screen QR code always agree. Use KEY="value" lines only.

# Setup hotspot broadcast when no known WiFi network is found on boot.
# The password must be at least 8 characters (WPA2).
HOTSPOT_SSID="SongRecPi"
HOTSPOT_PASSWORD="songrecpi"

# NetworkManager connection name for the hotspot, and the WiFi interface.
HOTSPOT_CON="SongRecPi-Hotspot"
WIFI_IFACE="wlan0"
